# Nginx : HTTPS public → serveur Node.js local (port 3000).
# __DOMAINE__ est remplacé par installer-serveur.sh ; certbot ajoute le HTTPS.
limit_req_zone $binary_remote_addr zone=amani_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAINE__;

    client_max_body_size 4m;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;

    # Écoute en temps réel (réponses jusqu'à 25 s) : pas de mise en tampon.
    location /api/sync/attendre {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 70s;
    }

    location /api/ {
        limit_req zone=amani_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 70s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
